[project]
name = "wally-browser"
version = "0.1.0"
description = "wally browser-use runs Jev Ultrafast. Eve chooses each step. DeepSeek types."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wally_browser", "jev_ultrafast"]

[tool.hatch.build.targets.wheel.force-include]
"jev_ultrafast/snapshot.js" = "jev_ultrafast/snapshot.js"
