# The one place every version, pin, and runner image in this repo lives.
# CMake reads it directly (cmake/sdk-pin.cmake); the copies that can't read TOML
# at their own step -- workflow refs and runners, the Homebrew formula, the Swift
# package pin, CMake's own floor -- are held to it by scripts/ci/check-versions.py,
# so drift fails CI. Format is flat `key = "value"`, one per line: both the CMake
# and the Python side parse it by regex. Keep it flat.

[product]
# wally's own release version; git tag is v<version> (auto-tag.yml reads it here).
version = "0.8.12"

[contracts]
# Vendored from InferenceInfra at this exact revision.
decisions_source_commit = "e60a50df8433426763042a6d947c56754e1894e3"
decisions_contract_sha256 = "6cd5afaa222e55337dcab1fa4b2bbee2763cea707e18d539a5ca252f6a863d11"

[sdk]
# The published C++ desktop kit this tree builds against; bump the SHAs with it.
kit_version = "0.20.40"
kit_release_tag = "cpp-desktop-v0.20.40"
idl_version = "1.6.0"
idl_schema_sha256 = "859d5ea75645ca0268e1348a9968813937ea5be0e35340768b0c07786e0993b6"
idl_protoc_version = "35.1"
kit_sha256_macos_arm64 = "e5a3f10d2ab6023e3d7c599c2a4ca2d05a083d294ac11f866910de0d581bb2f7"
kit_sha256_windows_x64 = "05720991852c948ce8c45462e025ab410d05fdce852ce1e5410e5c1b70cc0312"
kit_sha256_windows_arm64 = "8b59c3c090aae811f5206e60406a0bd5c3407c05ad71dc272c437a4232cd2157"
kit_sha256_linux_x64 = "a68b5943315780b4ce845d13966ef592f76595bf2fe9d21cc76e89385df7f35b"
kit_sha256_linux_arm64 = "22784d3e99752346e00917a92515ab5348d43093c9bbfe5e71954d7fb9a8d70b"

[swift]
# The Apple MLX host's Swift SDK: sdk_package_version pins swift/Package.swift,
# sdk_ci_ref is the complete runanywhere-sdks checkout ref (tag or commit SHA)
# used by ci.yml/release.yml. Both move on their own cadence, distinct from the
# C++ kit above.
#
# sdk_ci_ref is the cpp-desktop-v0.20.40 source commit plus its Apple binary
# checksums (siddhesh/kit-0.20.40-swift), not a tag name: release tags on
# that repo are not protected or immutable, and this checkout supplies the
# Swift code compiled into the Apple bottle, so a retargeted tag would change
# what ships. The SHA is what the tag resolved to when this pin was made.
sdk_package_version = "0.20.37"
tools_version = "6.0"
sdk_ci_ref = "8e3d147f4dea7609d48ff5bb7c75edb234051853"

[toolchain]
# CMake's own floor; CMakeLists.txt declares these and check-versions holds it here.
cmake_minimum = "3.27"
cxx_standard = "20"
# The Rust toolchain; rust-toolchain.toml pins the same channel.
rust = "1.93.1"

[runners]
# GitHub Actions images. macos_mlx needs Xcode 26 for the Swift host; macos_oss
# is the cheaper C++-only OSS build. check-versions fails an untracked runs-on.
macos_mlx = "macos-26"
macos_oss = "macos-14"
windows_x64 = "windows-2022"
windows_arm64 = "windows-11-arm"
linux = "ubuntu-24.04"
# Published Linux artifacts target this older ABI baseline; test-only jobs may
# use the newer image above.
linux_compat = "ubuntu-22.04"
# The arm64 bottle builds here: glibc 2.34, so wally's own code stays on the
# low floor while the kit's Sherpa prebuilt (glibc 2.38) rides in the bottle.
linux_arm64 = "ubuntu-22.04-arm"

[linux_abi]
# What the Linux bottle may ask of the system it runs on. Kit 0.20.39's
# Sherpa prebuilt needs glibc 2.38 and GLIBCXX_3.4.32. Building the bottle on
# Ubuntu 24.04 also pulls glibc 2.39 into wally itself, so the floor is Ubuntu
# 24.04 (GCC 13). Debian 13 clears it. scripts/release/check-linux-abi.py fails
# a release whose ELF files need a newer symbol version, or a shared library
# that is neither shipped in the bottle nor listed here. install.sh checks the
# same glibc, glibcxx_max and cxxabi_max before it downloads (MIN_GLIBC,
# MIN_GLIBCXX, MIN_CXXABI).
glibc_max = "2.39"
glibcxx_max = "3.4.32"
cxxabi_max = "1.3.13"
system_libraries = [
    "ld-linux-x86-64.so.2", "libc.so.6", "libm.so.6", "libdl.so.2",
    "libpthread.so.0", "librt.so.1", "libgcc_s.so.1", "libstdc++.so.6",
    "libssl.so.3", "libcrypto.so.3", "libcurl.so.4",
]
# PT_INTERP of the shipped executable (bin/wally): the loader the kernel execs
# before any DT_NEEDED library above is even tried. x86-64 glibc's own name.
interpreters = ["/lib64/ld-linux-x86-64.so.2"]

[linux_abi_arm64]
# The arm64 bottle has the same floor as the x86-64 one (Ubuntu 24.04, Debian
# 13). The kit's Sherpa prebuilt needs glibc 2.38 and GLIBCXX_3.4.32.
# It keeps its own block for the loader name and system libraries below. The
# Both kits pull zstd, brotli and bz2. The bottle bundles those under lib/
# (they are shipped, not listed here).
# check-linux-abi.py reads this block for an arm64 archive; install.sh holds
# MIN_GLIBC_ARM64/MIN_GLIBCXX_ARM64 to it.
glibc_max = "2.39"
glibcxx_max = "3.4.32"
cxxabi_max = "1.3.13"
system_libraries = [
    "ld-linux-aarch64.so.1", "libc.so.6", "libm.so.6", "libdl.so.2",
    "libpthread.so.0", "librt.so.1", "libgcc_s.so.1", "libstdc++.so.6",
    "libssl.so.3", "libcrypto.so.3", "libcurl.so.4",
]
interpreters = ["/lib/ld-linux-aarch64.so.1"]
