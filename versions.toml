# The one place every version, pin, and runner image in this repo lives.
# CMake reads it directly (cmake/sdk-pin.cmake); the copies that can't read TOML
# at their own step -- workflow refs and runners, the Homebrew formula, the Swift
# package pin, CMake's own floor -- are held to it by scripts/ci/check-versions.py,
# so drift fails CI. Format is flat `key = "value"`, one per line: both the CMake
# and the Python side parse it by regex. Keep it flat.

[product]
# wally's own release version; git tag is v<version> (auto-tag.yml reads it here).
version = "0.7.0"

[sdk]
# The published C++ desktop kit this tree builds against; bump the SHAs with it.
kit_version = "0.20.38"
kit_release_tag = "cpp-desktop-v0.20.38"
idl_version = "1.3.0"
idl_schema_sha256 = "9dcf42f472090813edc5b76c8d4711b9e32813f29808a657baf317f5ad07d473"
idl_protoc_version = "35.1"
kit_sha256_macos_arm64 = "8e45a36b7d5dc12d76c29659b158d95d72cf171649d0ad961637cdfee09219a5"
kit_sha256_windows_x64 = "250d974c08f791ce6dd066e4115124b4b88955a959d68b80b89ff6d531998acb"
kit_sha256_windows_arm64 = "d0a6a2a241052278b2689a960ec7fcb9c066e29b9d9e5a8206d87e7946dce956"
kit_sha256_linux_x64 = "bfa4a2bfde01c6ea352ec6b04d1b18832eb9ff03015c34b040216651e7fabf32"

[swift]
# The Apple MLX host's Swift SDK: sdk_package_version pins swift/Package.swift,
# sdk_ci_ref is the complete runanywhere-sdks checkout ref (tag or commit SHA)
# used by ci.yml/release.yml. Keep the leading v on tags. Both move
# on their own cadence, distinct from the C++ kit above.
sdk_package_version = "0.20.37"
tools_version = "6.0"
sdk_ci_ref = "b3a2b0147d8c66190c14a53bc04286efd6a4d64a"

[toolchain]
# CMake's own floor; CMakeLists.txt declares these and check-versions holds it here.
cmake_minimum = "3.27"
cxx_standard = "20"
# The Rust toolchain; rust-toolchain.toml pins the same channel.
rust = "1.93.1"

[runners]
# GitHub Actions images. macos_mlx needs Xcode 26 for the Swift host; macos_oss
# is the cheaper C++-only OSS build. check-versions fails an untracked runs-on.
macos_mlx = "macos-26"
macos_oss = "macos-14"
windows_x64 = "windows-2022"
windows_arm64 = "windows-11-arm"
linux = "ubuntu-24.04"
# Published Linux artifacts target this older ABI baseline; test-only jobs may
# use the newer image above.
linux_compat = "ubuntu-22.04"

[linux_abi]
# What the Linux bottle may ask of the system it runs on. The floor is Ubuntu
# 22.04 (glibc 2.35, libstdc++ from GCC 12); Debian 12 and newer Ubuntu clear
# it. scripts/release/check-linux-abi.py fails a release whose ELF files need a
# newer symbol version, or a shared library that is neither shipped in the
# bottle nor listed here. install.sh checks the same glibc, glibcxx_max and
# cxxabi_max before it downloads (MIN_GLIBC, MIN_GLIBCXX, MIN_CXXABI).
glibc_max = "2.35"
glibcxx_max = "3.4.30"
cxxabi_max = "1.3.13"
system_libraries = [
    "ld-linux-x86-64.so.2", "libc.so.6", "libm.so.6", "libdl.so.2",
    "libpthread.so.0", "librt.so.1", "libgcc_s.so.1", "libstdc++.so.6",
    "libssl.so.3", "libcrypto.so.3", "libcurl.so.4",
]
# PT_INTERP of the shipped executable (bin/wally): the loader the kernel execs
# before any DT_NEEDED library above is even tried. x86-64 glibc's own name.
interpreters = ["/lib64/ld-linux-x86-64.so.2"]
