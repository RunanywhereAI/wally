# The one place every version, pin, and runner image in this repo lives.
# CMake reads it directly (cmake/sdk-pin.cmake); the copies that can't read TOML
# at their own step -- workflow refs and runners, the Homebrew formula, the Swift
# package pin, CMake's own floor -- are held to it by scripts/ci/check-versions.py,
# so drift fails CI. Format is flat `key = "value"`, one per line: both the CMake
# and the Python side parse it by regex. Keep it flat.

[product]
# wally's own release version; git tag is v<version> (auto-tag.yml reads it here).
version = "0.6.0"

[sdk]
# The published C++ desktop kit this tree builds against; bump the SHAs with it.
kit_version = "0.20.37"
kit_release_tag = "v0.20.37"
idl_version = "1.3.0"
idl_schema_sha256 = "9dcf42f472090813edc5b76c8d4711b9e32813f29808a657baf317f5ad07d473"
idl_protoc_version = "35.1"
kit_sha256_macos_arm64 = "6e1f02a242300b712d759884b98cf7f0334288d7a57c5a1613dfdc5cb401be54"
kit_sha256_windows_x64 = "e1aa6a110527a796ce2c54f6e4e3cce19bfb69694fd623ffa839f4e600769820"
kit_sha256_windows_arm64 = "6166db03f31582cd327c2f92ecd36f65b57f311b8fcfb2996187801919384606"
kit_sha256_linux_x64 = "87eac4f74c5768cb4d1cec2cd7f6914a30106b52b2677d0cf4e694996e288f1e"

[swift]
# The Apple MLX host's Swift SDK: sdk_package_version pins swift/Package.swift,
# sdk_ci_ref is the complete runanywhere-sdks checkout ref (tag or commit SHA)
# used by ci.yml/release.yml. Keep the leading v on tags. Both move
# on their own cadence, distinct from the C++ kit above.
sdk_package_version = "0.20.37"
tools_version = "6.0"
sdk_ci_ref = "v0.20.37"

[toolchain]
# CMake's own floor; CMakeLists.txt declares these and check-versions holds it here.
cmake_minimum = "3.24"
cxx_standard = "20"

[runners]
# GitHub Actions images. macos_mlx needs Xcode 26 for the Swift host; macos_oss
# is the cheaper C++-only OSS build. check-versions fails an untracked runs-on.
macos_mlx = "macos-26"
macos_oss = "macos-14"
windows_x64 = "windows-2022"
windows_arm64 = "windows-11-arm"
linux = "ubuntu-24.04"
# Published Linux artifacts target this older ABI baseline; test-only jobs may
# use the newer image above.
linux_compat = "ubuntu-22.04"
