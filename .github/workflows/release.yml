name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.0 — no leading v)'
        required: true

permissions:
  contents: write

env:
  WALLY_VERSION: ${{ github.event.inputs.version || github.ref_name }}

# Every platform builds two bottles from one kit: `prod` (empty bake -> the
# production console defaults in credentials.cpp) and `dev` (dev console
# endpoints baked from the WALLY_DEV_* repo variables, so a dev build targets
# the dev backend with no env vars). The bake reaches the configure step as
# environment only — never on the command line, never in committed source. The
# configure→build→package sequence lives in .github/actions/build-wally; e2e
# runs on the binary it produced, so the bottle is built exactly once.
jobs:
  macos:
    # SDK Package.swift is swift-tools-version 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: RunanywhereAI/runanywhere-sdks
          ref: v0.20.31
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-release-macos-arm64
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-macos-arm64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/build/fetch-kit.sh macos-arm64 "${GITHUB_WORKSPACE}/kit"
      - uses: ./.github/actions/build-wally
        with:
          platform: macos-arm64
          kit-dir: ${{ github.workspace }}/kit
          variant: ${{ matrix.variant }}
          package: 'true'
      - name: Product e2e
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally
      - name: Verify archive
        run: |
          VERSION="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python3 scripts/release/verify-release-assets.py \
            "dist/wally-${VERSION}-macos-arm64${suffix}.tar.gz" \
            "dist/wally-${VERSION}-macos-arm64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-macos-arm64-${{ matrix.variant }}
          path: dist/wally-*-macos-arm64*.tar.gz*

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-release-windows-arm64
          variant: sccache
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-windows-arm64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/fetch-kit.sh windows-arm64 "${GITHUB_WORKSPACE}/kit"
      - uses: ./.github/actions/build-wally
        with:
          platform: windows-arm64
          kit-dir: ${{ github.workspace }}/kit
          variant: ${{ matrix.variant }}
          package: 'true'
      - name: Product e2e
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally.exe
      - name: Clean-room zip smoke
        shell: pwsh
        run: |
          $ver = "${env:WALLY_VERSION}".TrimStart("v")
          $suffix = if ("${{ matrix.variant }}" -eq "dev") { "-dev" } else { "" }
          scripts/test/smoke-zip-windows.ps1 -Zip "dist/wally-$ver-windows-arm64$suffix.zip"
      - name: Verify archive
        shell: bash
        run: |
          ver="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python scripts/release/verify-release-assets.py \
            "dist/wally-$ver-windows-arm64$suffix.zip" \
            "dist/wally-$ver-windows-arm64$suffix.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-windows-arm64-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-release-windows-x64
          variant: sccache
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-windows-x64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/fetch-kit.sh windows-x64 "${GITHUB_WORKSPACE}/kit"
      - uses: ./.github/actions/build-wally
        with:
          platform: windows-x64
          kit-dir: ${{ github.workspace }}/kit
          variant: ${{ matrix.variant }}
          package: 'true'
      - name: Product e2e
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally.exe
      - name: Clean-room zip smoke
        shell: pwsh
        run: |
          $ver = "${env:WALLY_VERSION}".TrimStart("v")
          $suffix = if ("${{ matrix.variant }}" -eq "dev") { "-dev" } else { "" }
          scripts/test/smoke-zip-windows.ps1 -Zip "dist/wally-$ver-windows-x86_64$suffix.zip"
      - name: Verify archive
        shell: bash
        run: |
          ver="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python scripts/release/verify-release-assets.py \
            "dist/wally-$ver-windows-x86_64$suffix.zip" \
            "dist/wally-$ver-windows-x86_64$suffix.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-windows-x64-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libcurl4-openssl-dev
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-release-linux-x64
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-linux-x64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/build/fetch-kit.sh linux-x64 "${GITHUB_WORKSPACE}/kit"
      - uses: ./.github/actions/build-wally
        with:
          platform: linux-x64
          kit-dir: ${{ github.workspace }}/kit
          variant: ${{ matrix.variant }}
          package: 'true'
      - name: Product e2e
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally
      - name: Verify archive
        run: |
          VERSION="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python3 scripts/release/verify-release-assets.py \
            "dist/wally-${VERSION}-linux-x86_64${suffix}.tar.gz" \
            "dist/wally-${VERSION}-linux-x86_64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-linux-x86_64-${{ matrix.variant }}
          path: dist/wally-*-linux-x86_64*.tar.gz*

  publish:
    needs: [macos, windows, windows-arm64, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release archives
        run: |
          set -euo pipefail
          VERSION="${WALLY_VERSION#v}"
          # Both bottles of every platform: prod (no suffix) and dev (-dev).
          for suffix in "" "-dev"; do
            python3 scripts/release/verify-release-assets.py \
              "artifacts/wally-${VERSION}-macos-arm64${suffix}.tar.gz" \
              "artifacts/wally-${VERSION}-macos-arm64${suffix}.tar.gz.sha256"
            python3 scripts/release/verify-release-assets.py \
              "artifacts/wally-${VERSION}-windows-x86_64${suffix}.zip" \
              "artifacts/wally-${VERSION}-windows-x86_64${suffix}.zip.sha256"
            python3 scripts/release/verify-release-assets.py \
              "artifacts/wally-${VERSION}-windows-arm64${suffix}.zip" \
              "artifacts/wally-${VERSION}-windows-arm64${suffix}.zip.sha256"
            python3 scripts/release/verify-release-assets.py \
              "artifacts/wally-${VERSION}-linux-x86_64${suffix}.tar.gz" \
              "artifacts/wally-${VERSION}-linux-x86_64${suffix}.tar.gz.sha256"
          done
      - name: Generate Homebrew formula update
        run: |
          set -euo pipefail
          VERSION="${WALLY_VERSION#v}"
          # Homebrew ships the production bottle; the dev bottle is not tapped.
          sidecar="artifacts/wally-${VERSION}-macos-arm64.tar.gz.sha256"
          digest=$(awk 'NF == 2 { print $1 }' "$sidecar")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/release/stamp-formula.py "$VERSION" "macos-arm64=${digest}"
          ruby -c Formula/wally.rb
          mkdir -p release-metadata
          cp Formula/wally.rb release-metadata/wally.rb
      - uses: actions/upload-artifact@v4
        with:
          name: wally-homebrew-formula
          path: release-metadata/wally.rb
          if-no-files-found: error
      - name: Stage and checksum the installers
        # Publish the installers themselves plus their SHA-256 beside the
        # bottles, so a cautious user can verify the script before running it:
        #   curl -fsSLO .../releases/download/v<ver>/install.sh
        #   curl -fsSLO .../releases/download/v<ver>/install.sh.sha256
        #   shasum -a 256 -c install.sh.sha256 && sh install.sh
        # Computed from the tagged installers, so the pair always matches.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for f in install.sh install.ps1; do
            [ -f "$f" ] || { echo "missing $f" >&2; exit 1; }
            cp "$f" "artifacts/$f"
            ( cd artifacts && shasum -a 256 "$f" > "${f}.sha256" )
          done
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            artifacts/wally-*.tar.gz
            artifacts/wally-*.tar.gz.sha256
            artifacts/wally-*.zip
            artifacts/wally-*.zip.sha256
            artifacts/install.sh
            artifacts/install.sh.sha256
            artifacts/install.ps1
            artifacts/install.ps1.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
