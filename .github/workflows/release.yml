name: Release

# Builds prod + dev on-device bottles for macOS, Linux, and Windows and cuts a
# GitHub Release. macOS carries GGUF (cgo rac_server) + MLX (Swift wally-mlx);
# Linux and Windows carry GGUF only (MLX is Apple-only). dev and prod differ
# only by the -dev suffix and the baked console endpoints.
#
# The C++ kit is public: RunanywhereAI/runanywhere-sdks, tag cpp-desktop-v<ver>,
# fetched anonymously with the default github.token (no PAT).

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.6.0 — no leading v)'
        required: true

permissions:
  contents: write

env:
  WALLY_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  # C++ desktop kit pin. Bump together with the on-device build recipe.
  KIT_VERSION: '0.20.37'

jobs:
  macos:
    # runanywhere-swift's Package.swift is swift-tools 6.x; macos-26 (Xcode 26 /
    # Swift 6.2) resolves it. macos-15 (Swift 6.1) cannot.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: httplib runtime deps (rac_server links brotli/zstd/openssl directly)
        run: brew install brotli zstd openssl@3
      - name: Fetch C++ kit (public, no token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-kit.sh macos-arm64 "$KIT_VERSION" "$GITHUB_WORKSPACE/kit"
      - name: Build on-device bottle (${{ matrix.variant }})
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: |
          ver="${WALLY_VERSION#v}"
          bash scripts/build-ondevice.sh -tag "$ver"
          WALLY_VERSION="$ver" bash scripts/package.sh build macos-arm64 "${{ matrix.variant }}"
      - name: Verify archive
        run: |
          ver="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python3 scripts/release/verify-release-assets.py \
            "dist/wally-${ver}-macos-arm64${suffix}.tar.gz" \
            "dist/wally-${ver}-macos-arm64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-macos-arm64-${{ matrix.variant }}
          path: dist/wally-*-macos-arm64*.tar.gz*

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build deps (rac_server's httplib extras + rpath tool)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libbz2-dev libbrotli-dev \
            libzstd-dev libssl-dev zlib1g-dev patchelf
      - name: Fetch C++ kit (public, no token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-kit.sh linux-x64 "$KIT_VERSION" "$GITHUB_WORKSPACE/kit"
      - name: Build on-device bottle (${{ matrix.variant }})
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: |
          ver="${WALLY_VERSION#v}"
          bash scripts/build-ondevice.sh -tag "$ver"
          WALLY_VERSION="$ver" bash scripts/package.sh build linux-x86_64 "${{ matrix.variant }}"
      - name: Verify archive
        run: |
          ver="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          python3 scripts/release/verify-release-assets.py \
            "dist/wally-${ver}-linux-x86_64${suffix}.tar.gz" \
            "dist/wally-${ver}-linux-x86_64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-linux-x86_64-${{ matrix.variant }}
          path: dist/wally-*-linux-x86_64*.tar.gz*

  # Windows on-device (GGUF) links the kit's static libs through cgo. The kit
  # is MSVC-built, so the toolchain here is the piece to iterate on in CI; the
  # job is non-blocking (continue-on-error) so a mac+linux release still cuts
  # while Windows is brought up.
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch C++ kit (public, no token)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-kit.sh windows-x64 "$KIT_VERSION" "$GITHUB_WORKSPACE/kit"
      - name: Build on-device bottle (${{ matrix.variant }})
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: |
          ver="${WALLY_VERSION#v}"
          bash scripts/build-ondevice.sh -tag "$ver"
          pwsh -File scripts/package-windows.ps1 -BuildDir build -Version "$ver" -Channel "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-windows-x86_64-${{ matrix.variant }}
          path: dist/wally-*-windows-x86_64*.zip*
          if-no-files-found: warn

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify present archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in artifacts/wally-*.tar.gz artifacts/wally-*.zip; do
            python3 scripts/release/verify-release-assets.py "$f" "$f.sha256"
            found=1
          done
          [ "$found" = 1 ] || { echo "no release archives were produced" >&2; exit 1; }
      - name: Stamp Homebrew formula from the macOS prod bottle
        run: |
          set -euo pipefail
          ver="${WALLY_VERSION#v}"
          sidecar="artifacts/wally-${ver}-macos-arm64.tar.gz.sha256"
          if [ -f "$sidecar" ]; then
            digest=$(awk 'NF == 2 { print $1 }' "$sidecar")
            python3 scripts/release/stamp-formula.py "$ver" "macos-arm64=${digest}"
            ruby -c Formula/wally.rb
            mkdir -p artifacts && cp Formula/wally.rb artifacts/wally.rb
          fi
      - name: Stage installers + checksums
        run: |
          set -euo pipefail
          for f in install.sh install.ps1; do
            [ -f "$f" ] || continue
            cp "$f" "artifacts/$f"
            ( cd artifacts && shasum -a 256 "$f" > "${f}.sha256" )
          done
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            artifacts/wally-*.tar.gz
            artifacts/wally-*.tar.gz.sha256
            artifacts/wally-*.zip
            artifacts/wally-*.zip.sha256
            artifacts/wally.rb
            artifacts/install.sh
            artifacts/install.sh.sha256
            artifacts/install.ps1
            artifacts/install.ps1.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
