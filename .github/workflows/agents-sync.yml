name: Agents sync

# Always runs (no paths-ignore). ci.yml skips **.md on push to main; this
# workflow is the gate that still catches AGENTS/CLAUDE and skill-tree drift.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: agents-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md / CLAUDE.md and skill trees must match
        run: bash scripts/ci/check-agents-sync.sh
