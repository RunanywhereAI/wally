name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'Formula/**'
      - '**.md'
  pull_request:
    # `main` and `dev` plus the launch branches, because a pull request stacked
    # onto one of those is still a pull request that has to be green. With `main`
    # alone the branches filter matches on the PR's base, so retargeting a PR
    # from `main` to `dev` or `launch/open-frontier-wally` did not fail CI — it
    # ran no CI at all, and the PR reported nothing rather than reporting a
    # problem.
    branches: [main, dev, 'launch/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate distribution tooling
        run: |
          set -euo pipefail
          python3 tests/test_release_assets.py
          python3 -m py_compile scripts/release/verify-release-assets.py scripts/release/stamp-formula.py
          bash -n scripts/build/package-wally.sh scripts/release/update-tap.sh
          ruby -c Formula/wally.rb
      - name: install.sh runs under POSIX sh (dash)
        # Served as `curl ... | sh`, and sh is dash here as on every Debian and
        # Ubuntu host. `sh -n` alone cannot catch a bashism -- `[[` parses as a
        # command name and `set -o pipefail` only fails at run time -- so the
        # real guards are shellcheck in sh mode and actually running it in dash.
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          sh -n install.sh
          dash -n install.sh
          shellcheck -s sh install.sh
          WALLY_INSTALL_SH=dash bash scripts/test/test-install-skill-dirs.sh
      - name: install.sh output is byte-identical under bash, dash and sh
        # Runs the real install.sh under all three with a stubbed curl/uname
        # and a fixture release -- no network -- across the happy path, an
        # unsupported platform, a bad checksum and a failed release lookup,
        # and diffs the output. Catches a reintroduced bashism that `sh -n`
        # cannot (dash parses `[[` as a command name; `pipefail` only fails
        # at run time) without depending on shellcheck knowing every case.
        run: bash scripts/test/test-install-cross-shell.sh
      - name: Console binding matches its pinned contract
        run: python3 contracts/generate_console_binding.py --check
      - name: Versions consistent with versions.toml
        run: python3 scripts/ci/check-versions.py
      - name: No retired model ids in user-facing text
        run: |
          set -euo pipefail
          python3 tests/test_retired_model_ids.py
          python3 scripts/ci/check-retired-model-ids.py

  macos:
    # SDK Package.swift is swift-tools-version 6.2 (Xcode 26). macos-15 is
    # Xcode 16.4 / Swift 6.1; macos-14 is Xcode 15 / Swift 5.10.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      WALLY_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: RunanywhereAI/runanywhere-sdks
          ref: v0.20.31
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-ci-macos-arm64
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-macos-arm64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/build/fetch-kit.sh macos-arm64 "$kit"
          if [[ ! -f "$kit/include/runanywhere/proto/model_types.pb.h" ]]; then
            echo "kit missing generated proto headers; listing prefix:" >&2
            find "$kit" -maxdepth 4 -type d -print >&2
            exit 1
          fi
          if [[ ! -f "$kit/share/runanywhere/SCHEMA_LOCK" ]]; then
            echo "kit missing share/runanywhere/SCHEMA_LOCK" >&2
            find "$kit/share" -print >&2
            exit 1
          fi
      - uses: ./.github/actions/build-wally
        with:
          platform: macos-arm64
          kit-dir: ${{ github.workspace }}/kit
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Product e2e (MLX host)
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libcurl4-openssl-dev
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-ci-linux-x64
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-linux-x64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/build/fetch-kit.sh linux-x64 "${GITHUB_WORKSPACE}/kit"
      # BUILD_TESTING=OFF (set inside the composite action for linux): the product
      # `wally` links cleanly on Linux, but the unit-test executables trip a
      # single-pass-ld quirk resolving header-only httplib's weak inline symbols
      # out of wally_core.a. Those tests run on macOS/Windows; Linux validates the
      # shipped binary through e2e.
      - uses: ./.github/actions/build-wally
        with:
          platform: linux-x64
          kit-dir: ${{ github.workspace }}/kit
      - name: Product e2e
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally

  windows-arm64:
    # Native ARM64 runner, free for public repos. Cross-compiling from the x64
    # host would build but never execute, and Windows-on-ARM is exactly where
    # the emulated x64 build needs a native alternative.
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-ci-windows-arm64
          variant: sccache
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-windows-arm64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/build/fetch-kit.sh windows-arm64 "$kit"
          test -f "$kit/include/runanywhere/proto/model_types.pb.h"
      - uses: ./.github/actions/build-wally
        with:
          platform: windows-arm64
          kit-dir: ${{ github.workspace }}/kit
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Smoke
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally.exe

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d
        with:
          key: ccache-ci-windows-x64
          variant: sccache
      - name: Cache kit
        id: kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kit
          key: kit-windows-x64-${{ hashFiles('versions.toml') }}
      - name: Download C++ desktop kit
        if: steps.kit.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/build/fetch-kit.sh windows-x64 "$kit"
          test -f "$kit/include/runanywhere/proto/model_types.pb.h"
      - uses: ./.github/actions/build-wally
        with:
          platform: windows-x64
          kit-dir: ${{ github.workspace }}/kit
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Smoke
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/test/e2e.sh ./build/wally.exe
